<style>
  body { font-family: "Microsoft YaHei", serif; line-height: 1.9; margin: 40px; color: #000; }
  h1 { text-align: center; font-size: 22px; }

<body>
  <h1>市图书馆开馆时间调整通知</h1>
  <p>尊敬的各位读者：</p>
  <p>为配合场馆设备检修，本馆自即日起临时调整开放时间，现将有关事项通知如下。</p>

  <h2>一、调整范围</h2>
  <p>一楼综合阅览区、二楼期刊阅览区及自习区均在调整范围内。少儿阅览区维持原开放时间不变。</p>

  <h2>二、开放时间</h2>
  <p>周一至周五开馆时间调整为上午九时至下午五时。周六、周日及法定节假日正常开放，时间为上午九时至下午八时。</p>

  <h2>三、其他事项</h2>
  <p>闭馆期间，线上数字资源检索与电子书借阅服务正常运行,请广大读者互相转告，合理安排到馆时间。</p>
  <p>特此通知。</p>
  <p style="text-align:right">市图书馆办公室</p>
</body>
</html>
