# 重开条件：换 MEA 大版本、或改工具环装配后必须重跑本组。

[[part.capability]]
id = "instruction-assigned-once"
summary = "指令只在 agent 级 ChatOptions 设一次；run 级 options 只带 Temperature，不得再带 Instructions"
impl = "AgentWorkbench.Runtime.Harness/AgentHarnessService"
evidence = [
  "AgentWorkbench.ApplicationTests.Runtime.ContextBoundaryTests.F38_指令走ChatOptionsInstructions_不自写装饰器也不挂Provider",
  "AgentWorkbench.CoreTests.Runtime.请求装配.生产装配形状_run级带Temperature时指令不丢也不重复",
]
# 实测坑：MAF 合并 agent 级 / run 级 ChatOptions 时，两级 Instructions 是换行拼接而非覆盖，
#         两处都设会让同一句指令变成 "A\nA" 重复进每轮请求。反例对照写在那条判据里。
# 负控：在任一 run 级 options 补 Instructions → F38 计数掉到 1，红。
# 重开条件：MAF 改成「run 级覆盖」语义后须重判此条与 BuildAgent 注释。

[[part.capability]]
id = "no-second-function-loop"
summary = "不挂 AIContextProviders、不自写 IChatClient 装饰器，保住 ③④ 的守卫与轨迹"
impl = "AgentWorkbench.Runtime.Harness/AgentHarnessService"
evidence = [
  "AgentWorkbench.ApplicationTests.Runtime.ContextBoundaryTests.F38_指令走ChatOptionsInstructions_不自写装饰器也不挂Provider",
  "AgentWorkbench.ApplicationTests.Runtime.LoopStructureTests.Harness_不得二次包裹函数调用环",
]
# 挂 provider 会让 MEA 在 FunctionInvokingChatClient 外再包一层环：
# 实测同参重复不再判 loop_detected、工具异常不再归类 tool_error。
# 这是旧 decorator-not-aicontextprovider 里「不挂 / 不另包」那一半的继承者（另一半已反转）。
# 重开条件：MAF 大版本升级后须在真实 ToolExecutionPipeline 装配下重跑探针，证明不多包环、
#           不绕过守卫与轨迹，才允许改这条。

