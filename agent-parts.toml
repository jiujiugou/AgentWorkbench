# agent-parts.toml — 一次 run 的六个动作 → 准许跨的编译单元
#
# 【状态】骨架样例。目前没有任何工具读它。按「文档只做解释」的判别线，
#         它此刻是解释性示例，不是约束；只有读取者 + 断言 + R0 自证落地后才是约束。
#         别把「已经写成 toml」当成「已经约束住」。
# 【范围】只登记「一次有独立证据的决定」，不登记框架能力全貌。全貌留给
#         src/Core/Runtime/AgentWorkbench.Runtime.Tools/功能调用功能查询.md（28 行 A–G + H 组）
#         ② 的能力对照表原在 docs/core/循环驱动功能查询.md，已不在工作区（未提交文件，
#         删后无痕）；框架类型级清单见 docs/机制层/MAF机制层扫描.md。这些都是查漏用的解释，不进门禁。
# 【事实源】代码 + 测试输出。本表是声明；与代码冲突时以代码为准，且门禁应报红。
# 【已填 ④ / ① / ③ / ⑤ / ⑥】① 已于 2026-11-13 用 MAF 原生装法重写并收口（being-replaced 撤销）；
#         ⑤ 于同日补入并补齐行为测试：18 条新用例覆盖长期记忆 / 保留清理 / 作用域，
#         现剩 2 条 partial（LongTermEnabled 默认值未按规格改、多实例互斥未建）；
#         ⑥ 于同日进表并收口：记录形状 + 读写分口 + 五条出口搬运，10 条能力全部 wired，
#         16 条用例全绿（停因结构化 / 用量 / 截断标志 / 完整性 / 准备阶段 / 读口拆分 / 落库往返），
#         配套落库 M033（七列 + agent_steps.truncated）。
#         ② 于 2026-11-14 最后进表：装配决定收在 Runtime.Harness/LoopAssembly，FICC 四项显式化，
#         4 条能力（3 wired + 1 unit-only，后者是「装配约定缺行为证据」的如实登记）。六格至此全部进表。

[meta]
version = 1
# 形状：part = 一个动作；allow = 只准跨这几个编译单元（许可，不是现状清单）
#       max_anchors = 度数上限，超了必须改表 —— 改表是一次带理由的提交
#       capability = 一次能被单独证伪的决定；doc = 该格的部件负责文档（解释，不是事实源）
# tests 与 evidence 必须分开：
#   tests    = 登记即须存在的测试文件/方法，可以红、可以跳过（Py 仓 verification 表形状）
#   evidence = 绿了才算证明，只在收尾时填
# status 取值：wired（缺省）/ unit-only / partial（判据先于实现）/ retired / being-replaced（part 级）
# impl 精确到「模块」或「模块/类型」：模块级决定写模块名即可，扫源码文本，
#       不依赖反射（Runtime.Tools 里有 internal 类型）。
# 断言（尚未实现，照 Py 仓 tests/test_gates.py 的形状）：
#   ① capability.impl 的模块必须在该 part.allow 内 —— 跨格越界即红
#   ② evidence 里的测试必须真实存在，且真触达 impl
#   ③ 有 impl 没 evidence / 有 evidence 没 impl —— 都红（双向互证）
#   ④ R0 自证：伪造一条越界或断链，检查器必须变红
#   ⑤ status 只允许上表取值；partial 必须写 claim / negative / remaining，unit-only 缺口属人工复核
#   ⑥ 方法约定（正例能绿、负控能红；能脚本判定的禁止用 AI 判）来自 docs/core/请求装配.md 第六节
#   ⑦ [[part.retired_decision]] 只是历史留痕，不参与 evidence 校验；改动旧决定必须新开 capability

[[part]]
id = "tool-execution"
label = "④ 工具执行"
max_anchors = 3
allow = [
  "AgentWorkbench.Runtime.Tools",  # 执行管道、参数校验、未知工具留痕
  "AgentWorkbench.Tools.Builtin",  # 工具实现（登记成 AITool）
  "AgentWorkbench.Tools.Mcp",      # 本地 / MCP 来源抹平
]
# 故意不出表：Runtime.Harness（工具清单挂请求，归 ①+②）、
#             AgentWorkbench.ActionGateway（业务策略与权限，边界外，不是 ④ 的编译单元）
# 注意：allow 是上限，不要求每项都有 capability；但 capability.impl 必须落在 allow 内。

[[part.capability]]
id = "result-upper-bound"
summary = "结果进模型前有内容上界（框架不给，本仓补）"
impl = "AgentWorkbench.Runtime.Tools/ToolExecutionPipeline"
evidence = [
  "AgentWorkbench.CoreTests.Runtime.Tools.ToolCallGapTests.结果进模型前有内容上界_轨迹截断作绿对照",
]
# 负控已做：回填改回 `return result` 会红。
# 重开条件：MEA 自带「进模型前」裁剪且经同样负控复验，可删此条。

[[part.capability]]
id = "argument-schema-guard"
summary = "调用前按 schema 挡下畸形参数并回填可归因拒绝码，零执行"
impl = "AgentWorkbench.Runtime.Tools/ToolExecutionPipeline"
evidence = [
  "AgentWorkbench.CoreTests.Runtime.Tools.ToolCallGapTests.畸形参数在调用前被挡下并回填可归因拒绝码_合法参数作绿对照",
]
# 负控已做：关掉 ValidateArguments 会红。
# 重开条件：仅当拒绝码语义被动作域契约接管（M1）才改此条。

[[part.capability]]
id = "exception-backfill-recheck"
summary = "替换 FunctionInvoker 后，工具异常仍被转成结果消息回填、不炸整轮"
impl = "AgentWorkbench.Runtime.Tools/ToolExecutionPipeline"
evidence = [
  "AgentWorkbench.CoreTests.Runtime.Tools.ToolCallGapTests.工具异常仍被转成结果消息回填且不炸整轮_正常工具作绿对照",
]
# 只复验、不新写实现。负控：拿掉 FunctionInvokingChatClient 包装会红。
# 重开条件：换 MEA 大版本或改循环装配后必须重跑本条。

[[part.capability]]
id = "unknown-tool-trace"
summary = "未知工具名不执行，但整轮结束要留痕（自写观察层，不改框架回填语义）"
impl = "AgentWorkbench.Runtime.Tools/ToolCallGuardChatClient"
evidence = [
  "AgentWorkbench.ApplicationTests.Runtime.S04ContractTests.S04_03_模型请求清单外的工具时不执行任何工具",
  "AgentWorkbench.ApplicationTests.Runtime.S04ContractTests.S04_05_清单外的工具调用被记录下来",
]
# 负控已做：删掉 ToolCallGuardChatClient 包装 / 删掉 Report 会红。
# 重开条件：若改挂 TerminateOnUnknownCalls=true，须先证明模型仍能看到错误。

# ── ④ 有意不接、但当前没有独立负控 → 只留决定，不进门禁 ──────────
# 这几条来自「功能调用功能查询.md」的「不需要」列。它们最容易被「顺手接上」
# 悄悄改回来（会绕过守卫与轨迹），是下一步最该补负控的地方。
# 现在写在这里只是决定留痕；等有证据了再升成 capability。
#   AdditionalTools（第 9 行）              重开条件：审计能证明额外工具对模型不可见
#   ApprovalRequiredAIFunction（第 25 行）   重开条件：自写三态 + fail-closed 被动作域契约取代
#   FunctionInvocationDelegatingAgent（28）  重开条件：证明换它不绕过工具环守卫与轨迹

# ───────────────────────────────────────────────────────────────
# ① 请求 / 上下文装配
# 与 ④ 不同：① 几乎没有「框架不给、本仓补的实现」，主体是
# 「框架给了扩展点，本仓选了一种注入形态，并刻意偏离框架默认」。
# ───────────────────────────────────────────────────────────────

[[part]]
id = "request-assembly"
label = "① 请求 / 上下文装配"
doc = "docs/core/请求装配.md"        # 部件负责文档；本文是声明，两者人工对齐，互不生成
# 2026-11-13 收口：MAF 原生装法已落地，being-replaced 撤销。
# 替换前登记的重开条件（真实 ToolExecutionPipeline 装配下复验守卫与轨迹）仍有一半未闭合：
# 见下方 maf-injection-equivalence.remaining 的端到端装配级负控。
max_anchors = 2
allow = [
  "AgentWorkbench.Runtime.Context",  # Compose → ContextPlan（消息形态 / 预算 / 合成）
  "AgentWorkbench.Runtime.Harness",  # BuildAgent 把 Instructions 放进 ChatOptions（唯一注入点）
]
# 来源：文档第三节「三处分工」→ allow / max_anchors；文档第二节「不归本格」→ 负向判据：
#       Runtime.Session、Memory.Persistence、Runtime.Model、ActionGateway、Runtime.Tools 不许进 allow。
# 文档第四节三个配置键（Enabled / MaxHistoryMessages / MaxFragmentChars）不进本表：数字会漂、代码推得出。
# 文档第五/六节的方法约定（正例绿、负控红、加能力要做三件事）见 [meta] 断言 ⑥，不重复登记。
# ① 跨两模块的硬证据：F38 同时扫 ContextDir + HarnessDir，要求两边都不出现
#   AIContextProviders / ContextInjectingChatClient / IContextAssembler，并正面对照
#   Instructions = instructions / UseProvidedChatClientAsIs / _context.Compose / CreateChatHistoryProvider。
# 故意不出表：Runtime.Context.csproj 只 ProjectReference Shared；
#             Runtime.Session / Memory.Persistence 是运行时 DI 覆盖历史 provider，不是 ① 的编译落点；
#             Shared 是通用底座，不算 ① 的跨界。

# ── 已退休的决定（历史留痕，不进门禁，见 [meta] 断言 ⑦）──────────────
# 这些条目的 evidence 指向已被删除或改写的测试/类型，保留只为「为什么曾经这么决定、
# 哪些证据随替换作废」。改动旧决定不复活条目，而是新开 capability。
