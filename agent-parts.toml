was = "run 级指令每轮进模型请求，且不写进会话历史"
evidence_was = "ContextAssemblerTests.F34_Instruction_InjectedIntoRequestOnce_AndNeverIntoHistory"
reason = "ContextInjectingChatClient 删除；改由 ChatOptions.Instructions 实现，见 maf-injection-equivalence"

[[part.retired_decision]]
id = "disabled-zero-injection"
was = "禁用态零注入，且能力位不是假绿"
evidence_was = "ContextAssemblerTests.F35_DisabledState_ZeroInjection_AndCapabilityBitIsNotFakeGreen"
reason = "原 F35 是预期红（能力位回显 Enabled 属假绿）；换装法后指令/历史真接线，新 F35 转绿且断言语义改变"

[[part.retired_decision]]
id = "no-injection-identity"
was = "无注入时 Wrap 原样返回 inner 实例（不空包一层）"
evidence_was = "ContextAssemblerTests.F36_NoInjection_ReturnsSameInnerInstance"
