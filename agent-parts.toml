# ⑤ 明确不用框架能力（无负控，故不登记为 capability，只留决定与重开条件）：
#
#   Compaction / CompactionProvider（滑窗、截断、摘要、工具结果压缩等六策略）
#     为什么不用：它是 AIContextProvider 子类，挂载撞 ① 的红线 F38——MEA 会在工具环外再包一层，
#                 loop_detected / tool_error / 轨迹全失效。F38 只扫 Context + Harness 两目录，
#                 本格加 provider 不会被它拦；那是门禁盲区，不是许可。
#     代价：模型可见历史是全量，没有 token 上限。
#     重开条件：① 在真实 ToolExecutionPipeline 装配下重验通过（或 F38 撤销）后，
#               在真实装配里补一条「压缩后 loop_detected 仍生效」的负控，才允许接。
#     另注：上一轮删自写 TrimHistory 是对的——Compaction 的强项是保住 tool-call/result 配对，
#           自写按条数切会拆散一对，下一次模型请求直接结构报错。
#
#   ChatHistoryMemoryProvider（向量化语义召回 + BeforeAIInvoke 自动注入）
#     为什么不用：同样是 AIContextProvider 子类，撞 F38；另需 VectorStore
#                 （依赖已在 Knowledge.Local 的 CommunityToolkit.VectorData.SqliteVec，本模块未引）。
#     代价：召回只有 LIKE 关键词，命中率低；没有自动召回，只有模型主动调 recall。
#     重开条件：同上，且先定语义召回的评测口径——否则换过去也不知道好坏。
#
#   AgentSessionStore 的 GetSessionLock
#     为什么不当作业务闸：它是 loop 内 pending messages 的串行化，不阻挡第二个 run 进入。
#     误用后果：看起来有锁，实际两个 run 并行推进同一会话。
#
#   RequirePerServiceCallChatHistoryPersistence
#     为什么不开：H1/H2 实测一次 run 结束时工具调用与结果都已在历史里；开它只会改变
#                 FunctionInvokingChatClient 行为（守卫与轨迹随之变），收益为零、风险非零。
#
#   框架缺失、本仓必须自补的（部件文档 1.2 五条）：
#     AgentSessionStore 与 ChatHistoryProvider 的落库实现、结构化记忆条目、保留期清理、多实例互斥。
#     都不是「框架不会」，而是「框架只给抽象，不管存储/保留期/互斥/隔离边界」。

