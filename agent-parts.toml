evidence = [
  "AgentWorkbench.CoreTests.Runtime.请求装配.指令每轮都在模型请求里_且不写进会话历史",
  "AgentWorkbench.CoreTests.Runtime.请求装配.没有指令时请求里不出现system消息_空包对照",
  "AgentWorkbench.CoreTests.Runtime.请求装配.本轮输入独立成一条user消息_不与历史拼接",
  "AgentWorkbench.CoreTests.Runtime.请求装配.工具往返完整留在会话历史_守卫与轨迹不丢",
  "AgentWorkbench.CoreTests.Runtime.请求装配.UseProvidedChatClientAsIs时工具环不另包一层_两轮模型请求",
  "AgentWorkbench.CoreTests.Runtime.请求装配.生产装配形状_run级带Temperature时指令不丢也不重复",
]
# 装配形状：FunctionInvokingChatClient → ChatClientAgent(UseProvidedChatClientAsIs=true,
#           InMemoryChatHistoryProvider, ChatOptions.Instructions/Tools)。刻意不碰本仓旧自写类。
# remaining：真实 ToolExecutionPipeline（含 ToolCallGuardChatClient）下的端到端负控仍未补——
#           ③ 的 loop_detected、④ 的 tool_error/轨迹 现在只有单测证据，抓不到绕过守卫。
