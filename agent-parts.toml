[[part.retired_decision]]
id = "history-fragment-budget"
was = "历史按条数保新、片段按字符预算按序截断（status=unit-only）"
evidence_was = "ContextAssemblerTests.F32 / F33"
reason = "两半都删：历史归 MAF provider（框架无条数开关）；片段预算没有生产调用方，2026-11-13 随 F32/F33 一起删除，能力待 M2 重建"

[[part.retired_decision]]
id = "decorator-not-aicontextprovider"
was = "上下文注入走 IChatClient 装饰器，不挂 AIContextProviders；且不另包函数调用环"
evidence_was = "ContextBoundaryTests.F38_InjectionUsesChatClientDecorator_NotAIContextProviders"
reason = "方向反转：装饰器这一半删除，改用框架原生 ChatOptions.Instructions；「不挂 provider / 不另包环」这一半由 no-second-function-loop 继承"

[[part.capability]]
