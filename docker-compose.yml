services:
  agentworkbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentworkbench:latest
    container_name: agentworkbench
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

