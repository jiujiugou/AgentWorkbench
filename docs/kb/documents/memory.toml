# ── 配置口径：读 appsettings 对账，不在文档里抄一份
[[documents.fact]]
claim = "会话记忆启用"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Harness:Memory:SessionEnabled"
expect = true

[[documents.fact]]
claim = "会话快照空闲过期 1440 分钟"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Harness:Memory:SessionTtlMinutes"
expect = 1440

[[documents.fact]]
claim = "进程内会话缓存上限 1000"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Harness:Memory:MaxCachedSessions"
expect = 1000

[[documents.fact]]
claim = "过期清理周期 60 秒"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Harness:Memory:EvictionSweepSeconds"
expect = 60

[[documents.fact]]
claim = "长期记忆当前启用（与「应为 false」的规格相反）"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Harness:Memory:LongTermEnabled"
expect = true

[[documents.fact]]
claim = "工具写入默认作用域 session"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Harness:Memory:LongTermScope"
expect = "session"

[[documents.fact]]
claim = "单条记忆上限 2000 字符"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Harness:Memory:MaxMemoryChars"
expect = 2000

[[documents.fact]]
claim = "取库候选上限 20 条"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Harness:Memory:RecallCandidateK"
expect = 20

[[documents.fact]]
claim = "记忆保留天数未设上限（0）"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Harness:Memory:LongTermRetentionDays"
expect = 0

# ── 依赖版本：读 csproj 对账
[[documents.fact]]
claim = "会话模块引用 MAF 1.23.0"
check = "csproj"
path = "src/Core/Runtime/AgentWorkbench.Runtime.Session/AgentWorkbench.Runtime.Session.csproj"
package = "Microsoft.Agents.AI"
expect = "1.23.0"

[[documents.fact]]
claim = "落库模块引用 MEA 10.10.0"
check = "csproj"
path = "src/Implementations/AgentWorkbench.Memory.Persistence/AgentWorkbench.Memory.Persistence.csproj"
package = "Microsoft.Extensions.AI"
expect = "10.10.0"

# ── 测试规模：数 [Fact]/[Theory]，防止测试被删了文档还留着
[[documents.fact]]
