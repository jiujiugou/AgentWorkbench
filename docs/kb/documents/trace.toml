# 轨迹与观测（六部件之⑥）
# 字段含义见 scripts/kb_check.py 顶部说明。

[[documents]]
path = "docs/core/轨迹与观测.md"
watch = [
  "src/Core/Runtime/AgentWorkbench.Runtime.Harness/**",
  "src/Core/Engineering/AgentWorkbench.Observability/**",
]

