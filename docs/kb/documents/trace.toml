# ── 判据：内核侧用例 + 记录形状与表结构的对照
[[documents.evidence]]
type = "test"
path = "tests/AgentWorkbench.CoreTests/Engineering/Observability/轨迹与观测.cs"
[[documents.evidence]]
type = "test"
path = "tests/AgentWorkbench.CoreTests/Engineering/Observability/轨迹落库迁移.cs"

# ── 依赖基线：附录 A 说「版本以工程文件为准」，这里对账
[[documents.fact]]
claim = "循环驱动侧引用的 MEA 基线为 10.10.0"
check = "csproj"
path = "src/Core/Runtime/AgentWorkbench.Runtime.Harness/AgentWorkbench.Runtime.Harness.csproj"
package = "Microsoft.Extensions.AI"
expect = "10.10.0"

[[documents.fact]]
claim = "框架基线为 MAF 1.23.0"
check = "csproj"
path = "src/Core/Runtime/AgentWorkbench.Runtime.Harness/AgentWorkbench.Runtime.Harness.csproj"
package = "Microsoft.Agents.AI"
expect = "1.23.0"

# ── 测试规模：数 [Fact]/[Theory]，防止用例被删了文档还留着
[[documents.fact]]
claim = "内核侧判据 14 个测试方法"
check = "test-count"
path = "tests/AgentWorkbench.CoreTests/Engineering/Observability/轨迹与观测.cs"
expect = 14

[[documents.fact]]
claim = "记录形状与表结构的对照 2 个测试方法"
check = "test-count"
path = "tests/AgentWorkbench.CoreTests/Engineering/Observability/轨迹落库迁移.cs"
expect = 2
