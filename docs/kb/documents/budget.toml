[[documents.fact]]
claim = "缺口（超时真取消、状态码配对）4 个测试方法"
check = "test-count"
path = "tests/AgentWorkbench.CoreTests/Runtime/ExecutionControl/ExecutionControlGapTests.cs"
expect = 4

[[documents.fact]]
claim = "循环驱动装配判据 5 个测试方法"
