# 终止与预算（六部件之③）
# 字段含义见 scripts/kb_check.py 顶部说明。

[[documents]]
path = "docs/core/终止与预算.md"
watch = [
  "src/Core/Runtime/AgentWorkbench.Runtime.ExecutionControl/**",
]
[[documents.evidence]]
type = "source"
path = "src/Core/Runtime/AgentWorkbench.Runtime.ExecutionControl/AgentExecutionControlService.cs"
symbols = [
  "IAgentExecutionControl",
  "CreateGuard",
  "ExecuteAsync",
  "AgentRunTimeoutException",
]
[[documents.evidence]]
type = "source"
path = "src/Core/Runtime/AgentWorkbench.Runtime.ExecutionControl/AgentRunGuard.cs"
symbols = [
  "InspectToolCall",
  "InspectCompletion",
  "DetectLoop",
  "DetectBudgetOverage",
]
[[documents.evidence]]
type = "source"
path = "src/Core/Runtime/AgentWorkbench.Runtime.ExecutionControl/AgentExecutionControlOptions.cs"
symbols = [
  "SectionName",
  "MaxIterations",
  "TimeoutSeconds",
  "MaxRepeatedToolCalls",
  "MaxTokensPerRun",
]
[[documents.evidence]]
type = "source"
path = "src/Core/Runtime/AgentWorkbench.Runtime.Harness/LoopAssembly.cs"
symbols = [
  "CreateLimits",
  "MaxConsecutiveErrorsPerRequest",
  "AllowConcurrentInvocation",
  "TerminateOnUnknownCalls",
]
[[documents.evidence]]
