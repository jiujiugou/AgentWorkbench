path = "src/Core/Foundation/AgentWorkbench.Shared/Execution/AgentRunStop.cs"
symbols = ["IAgentRunGuard", "AgentRunStop", "RunStopDetail"]
[[documents.evidence]]
type = "source"
path = "src/Core/Foundation/AgentWorkbench.Shared/Execution/AgentRunStatus.cs"
symbols = ["IterationLimit", "LoopDetected", "BudgetExceeded"]
[[documents.evidence]]
type = "test"
path = "tests/AgentWorkbench.ApplicationTests/Flow/S09ContractTests.cs"
[[documents.evidence]]
type = "test"
path = "tests/AgentWorkbench.CoreTests/Runtime/ExecutionControl/AgentRunGuardTests.cs"

# ── 配置口径：读 appsettings 对账，不在文档里抄一份
[[documents.fact]]
claim = "启动配置迭代上限 6"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Harness:ExecutionControl:MaxIterations"
expect = 6

[[documents.fact]]
claim = "启动配置墙钟 300 秒（代码默认 30，被配置覆盖）"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Harness:ExecutionControl:TimeoutSeconds"
expect = 300

[[documents.fact]]
claim = "连续同参重复阈值 3"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Harness:ExecutionControl:MaxRepeatedToolCalls"
expect = 3

[[documents.fact]]
claim = "run 级 token 预算未设上限（0）"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Harness:ExecutionControl:MaxTokensPerRun"
expect = 0

# ── 测试规模：数 [Fact]/[Theory]，防止测试被删了文档还留着
[[documents.fact]]
claim = "S09 运行结局 6 个测试方法"
check = "test-count"
path = "tests/AgentWorkbench.ApplicationTests/Flow/S09ContractTests.cs"
expect = 6

[[documents.fact]]
claim = "守卫判定 8 个测试方法"
check = "test-count"
path = "tests/AgentWorkbench.CoreTests/Runtime/ExecutionControl/AgentRunGuardTests.cs"
