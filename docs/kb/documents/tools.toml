# 工具执行（六部件之④）
# 字段含义见 scripts/kb_check.py 顶部说明；这里只存关系、证据与带 expect 的事实。

[[documents]]
path = "docs/core/工具执行.md"
watch = [
  "src/Core/Runtime/AgentWorkbench.Runtime.Tools/**",
  "src/Core/Tools/**",
  # §4 与 §5.2 讲动作闸边界与「查证不重放」，改动作链会动到这两节的判断
  "src/Core/Runtime/AgentWorkbench.ActionGateway/**",
]
[[documents.evidence]]
type = "source"
path = "src/Core/Runtime/AgentWorkbench.Runtime.Tools/ToolExecutionPipeline.cs"
symbols = [
  "ToolExecutionRun Create",
  "ValidateArguments",
  "InspectApprovalAsync",
  "BeginCall",
  "CompleteCall",
]
[[documents.evidence]]
type = "source"
path = "src/Core/Runtime/AgentWorkbench.Runtime.Tools/Safety/ToolPolicy.cs"
symbols = ["IsAllowed"]
[[documents.evidence]]
type = "source"
path = "src/Core/Runtime/AgentWorkbench.Runtime.Tools/ToolCallGuardChatClient.cs"
symbols = ["Report"]
[[documents.evidence]]
type = "source"
path = "src/Core/Tools/AgentWorkbench.Tools.Mcp/McpToolRegistry.cs"
symbols = ["McpToolCapability", "From"]
[[documents.evidence]]
type = "source"
path = "src/Core/Foundation/AgentWorkbench.Shared/Execution/AgentRunStop.cs"
symbols = ["IAgentRunGuard"]
[[documents.evidence]]
type = "test"
path = "tests/AgentWorkbench.ApplicationTests/Flow/S04ContractTests.cs"

# ── 配置口径：读 appsettings 对账，不在文档里抄一份
[[documents.fact]]
claim = "启动实际白名单 7 项，比代码默认 6 项多 propose_action"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Harness:Tools:Whitelist"
expect_count = 7
expect_contains = ["propose_action", "mcp__rag__*", "calculator"]

[[documents.fact]]
claim = "审批默认 Auto"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Harness:Approval:Default"
expect = "Auto"

[[documents.fact]]
claim = "审批 Overrides 为空"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Harness:Approval:Overrides"
expect_count = 0

[[documents.fact]]
claim = "rag server 只放行 search_knowledge"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Mcp:Servers:rag:AllowTools"
expect = ["search_knowledge"]

[[documents.fact]]
claim = "erpnext server 显式不暴露给模型"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Mcp:Servers:erpnext:ExposeToModel"
expect = false

[[documents.fact]]
claim = "erpnext 放行 3 项，含 frappe_get_doc"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Mcp:Servers:erpnext:AllowTools"
expect_count = 3
expect_contains = ["frappe_get_doc", "frappe_create_doc", "frappe_update_doc"]

[[documents.fact]]
claim = "rag 的 TrustedReadOnly 点名 search_knowledge"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Mcp:Servers:rag:TrustedReadOnly"
expect = ["search_knowledge"]

# ── 依赖版本：读 csproj 对账
[[documents.fact]]
claim = "工具执行引用 MEA 10.10.0"
check = "csproj"
path = "src/Core/Runtime/AgentWorkbench.Runtime.Tools/AgentWorkbench.Runtime.Tools.csproj"
package = "Microsoft.Extensions.AI"
expect = "10.10.0"

[[documents.fact]]
claim = "上游循环驱动引用 MAF 1.23.0"
check = "csproj"
path = "src/Core/Runtime/AgentWorkbench.Runtime.Harness/AgentWorkbench.Runtime.Harness.csproj"
package = "Microsoft.Agents.AI"
expect = "1.23.0"

[[documents.fact]]
claim = "MCP 客户端 2.4.0"
check = "csproj"
path = "src/Core/Tools/AgentWorkbench.Tools.Mcp/AgentWorkbench.Tools.Mcp.csproj"
package = "ModelContextProtocol"
expect = "2.4.0"

