# 循环驱动（六部件之②）
# 字段含义见 scripts/kb_check.py 顶部说明。

[[documents]]
path = "docs/core/循环驱动.md"
watch = [
  "src/Core/Runtime/AgentWorkbench.Runtime.Harness/**",
]
[[documents.evidence]]
type = "source"
path = "src/Core/Runtime/AgentWorkbench.Runtime.Harness/AgentHarnessService.cs"
symbols = ["BuildAgent", "FinishSucceededAsync"]
[[documents.evidence]]
type = "source"
path = "src/Core/Runtime/AgentWorkbench.Runtime.Harness/LoopAssembly.cs"
symbols = [
  "CreateLimits",
  "MaxConsecutiveErrorsPerRequest",
  "AllowConcurrentInvocation",
  "TerminateOnUnknownCalls",
  "UseProvidedChatClientAsIs",
]
[[documents.evidence]]
type = "source"
path = "src/Core/Runtime/AgentWorkbench.Runtime.ExecutionControl/IAgentExecutionControl.cs"
symbols = ["ExecuteAsync", "CreateGuard", "MaxIterations"]
[[documents.evidence]]
type = "source"
path = "src/Core/Runtime/AgentWorkbench.Runtime.ExecutionControl/AgentRunGuard.cs"
symbols = ["InspectToolCall", "InspectCompletion"]

# ── 配置口径：读 appsettings 对账，不在文档里抄一份
[[documents.fact]]
claim = "迭代预算 6：③ 定义、② 经 CreateLimits 交给框架"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Harness:ExecutionControl:MaxIterations"
expect = 6

[[documents.fact]]
claim = "run 级墙钟生产配 300 秒（代码默认 30，宿主覆盖）"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Harness:ExecutionControl:TimeoutSeconds"
expect = 300

[[documents.fact]]
claim = "连续重复调用上限 3"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Harness:ExecutionControl:MaxRepeatedToolCalls"
expect = 3

[[documents.fact]]
claim = "token 上限 0 = 不限"
check = "json"
path = "src/Host/AgentWorkbench.Webapi/appsettings.json"
json_path = "Harness:ExecutionControl:MaxTokensPerRun"
expect = 0

# ── 依赖版本：装配常量按这两个版本的默认值取值，升级时要复核
[[documents.fact]]
claim = "② 所在程序集依赖 MEA 10.10.0"
check = "csproj"
path = "src/Core/Runtime/AgentWorkbench.Runtime.Harness/AgentWorkbench.Runtime.Harness.csproj"
package = "Microsoft.Extensions.AI"
expect = "10.10.0"

[[documents.fact]]
claim = "② 所在程序集依赖 MAF 1.23.0"
check = "csproj"
path = "src/Core/Runtime/AgentWorkbench.Runtime.Harness/AgentWorkbench.Runtime.Harness.csproj"
package = "Microsoft.Agents.AI"
expect = "1.23.0"

# ── 测试规模：数 [Fact]/[Theory]，防止测试被删除后文档还留着
[[documents.fact]]
claim = "循环行为回归锁 8 个方法"
check = "test-count"
path = "tests/AgentWorkbench.CoreTests/Runtime/循环驱动.cs"
expect = 8

[[documents.fact]]
claim = "装配判据 5 个方法"
check = "test-count"
path = "tests/AgentWorkbench.CoreTests/Runtime/循环驱动装配.cs"
expect = 5
