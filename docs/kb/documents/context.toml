# 请求装配（六部件之一）
# 字段含义见 scripts/kb_check.py 顶部说明。

[[documents]]
path = "docs/core/请求装配.md"
watch = [
  "src/Core/Runtime/AgentWorkbench.Runtime.Context/**",
]
[[documents.evidence]]
type = "source"
path = "src/Core/Runtime/AgentWorkbench.Runtime.Context/RequestContextComposer.cs"
symbols = ["Compose", "CreateChatHistoryProvider"]
[[documents.evidence]]
type = "source"
path = "src/Core/Runtime/AgentWorkbench.Runtime.Context/ContextModels.cs"
symbols = ["ContextRequest", "ContextPlan"]
[[documents.evidence]]
type = "source"
path = "src/Core/Runtime/AgentWorkbench.Runtime.Context/ContextOptions.cs"
symbols = ["SectionName", "Enabled"]
[[documents.evidence]]
type = "source"
path = "src/Core/Runtime/AgentWorkbench.Runtime.Harness/AgentHarnessService.cs"
symbols = ["BuildAgent"]
[[documents.evidence]]
type = "source"
path = "src/Core/Runtime/AgentWorkbench.Runtime.Harness/HarnessModels.cs"
symbols = ["HarnessRunRequest"]
[[documents.evidence]]
type = "test"
path = "tests/AgentWorkbench.ArchitectureTests/ContextBoundaryTests.cs"

# ── 测试规模：数 [Fact]/[Theory]，防止测试被删了文档还留着
[[documents.fact]]
claim = "请求装配的注入等价判据 6 个方法"
check = "test-count"
path = "tests/AgentWorkbench.CoreTests/Runtime/请求装配.cs"
expect = 6

[[documents.fact]]
claim = "装配产物形态判据 3 个方法"
check = "test-count"
path = "tests/AgentWorkbench.CoreTests/Runtime/Context/ContextComposerTests.cs"
expect = 3

[[documents.fact]]
claim = "结构门禁 2 条（F37 业务词、F38 指令走请求选项）"
check = "test-count"
path = "tests/AgentWorkbench.ArchitectureTests/ContextBoundaryTests.cs"
expect = 2
